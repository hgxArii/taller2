<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Sistema de Créditos</title>
    <link rel="stylesheet" href="simulador_completo.css">

</head>
<body>
    <header>
        <h1>Sistema Básico de Créditos</h1>
    </header>
    <nav>
        <button type="button" onclick="mostrarSeccion('parametros')">
            Parámetros
        </button>
        <button type="button" onclick="mostrarSeccion('clientes')">
            Clientes
        </button>
        <button type="button" onclick="mostrarSeccion('creditos')">
            Créditos
        </button>
    </nav>

    <section id="parametros">
        <h2>Configurar Parámetros</h2>

        <input
            type="number"
            id="tasaInteres"
            min="10"
            max="20"
            value="15"
            placeholder="Tasa de interés">
        <span>%</span>
        <br>

        <button type="button" onclick="guardarTasa()">
            Guardar tasa
        </button>

        <p id="mensajeTasa"></p>
    </section>

    <section id="clientes">

        <h2>Registro de Clientes</h2>
        <input type="text" id="cedula" placeholder="Cédula">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellido" placeholder="Apellido">

        <input
            type="number"
            id="ingresos"
            min="0"
            step="any"
            placeholder="Ingresos"
        >

        <input
            type="number"
            id="egresos"
            min="0"
            step="any"
            placeholder="Egresos"
        >
        <br>

        <button type="button" onclick="guardarCliente()">
            Guardar cliente
        </button>
        <button type="button" onclick="limpiar()">
            Limpiar
        </button>
        
        <table>
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Ingresos</th>
                    <th>Egresos</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaClientes"></tbody>
        </table>
    </section>

    <section id="creditos">
        <h2>Simulación de Créditos</h2>

        <label for="cedulaCredito">Cédula del cliente:</label>
        <input
            type="text"
            id="cedulaCredito"
            placeholder="Ingrese la cédula"
        >

        <button type="button" onclick="buscarClienteCredito()">
            Buscar cliente
        </button>

        <div id="datosClienteCredito"></div>
        <h3>Datos del crédito</h3>
        <label for="montoCredito">Monto solicitado:</label>

        <input
            type="number"
            id="montoCredito"
            min="0"
            step="any"
            placeholder="Monto del crédito"
        >
        <br>

        <label for="plazoCredito">Plazo en meses:</label>
        <input type="number" id="plazoCredito" min="1" step="1" placeholder="Cantidad de meses">
        <br>

        <button type="button" onclick="calcularCredito()">
            Calcular crédito
        </button>

        <div id="resultadoCredito"></div>
    </section>
    <script src="utilitarios.js"></script>
    <script src="simulador_completo.js"></script>
</body>
</html>
